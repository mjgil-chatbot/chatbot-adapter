[workspace]
members = [
    "crates/agent-adapter-core",
    "crates/agent-adapter-cli",
    "crates/agent-adapter-config",
    "crates/agent-adapter-transports",
    "crates/agent-adapter-providers",
    "crates/agent-adapter-router",
    "crates/agent-adapter-testkit",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "0BSD"

[workspace.dependencies]
async-trait = "0.1"
futures-core = "0.3"
futures-util = "0.3"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "time", "sync"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
which = "8"
camino = { version = "1", features = ["serde1"] }

[profile.release]
opt-level = 1
lto = false
codegen-units = 16
incremental = true

[profile.test]
opt-level = 3
debug = false

[profile.dev]
opt-level = 3
debug = false

[profile.release.package."*"]
opt-level = 3

[profile.ship]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
incremental = false
